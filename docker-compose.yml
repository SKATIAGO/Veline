name: veline

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veline}
      POSTGRES_DB: ${POSTGRES_DB:-veline}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - veline-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-veline} -d ${POSTGRES_DB:-veline}']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      TZ: Europe/Madrid
      DATABASE_URL: postgresql://${POSTGRES_USER:-veline}:${POSTGRES_PASSWORD:-veline}@db:5432/${POSTGRES_DB:-veline}?schema=public
      # Correo — ver docs/08-correo.md. La clave vive en .env, nunca en el repo.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_MODE: ${MAIL_MODE:-dry}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Veline}
      MAIL_OVERRIDE_TO: ${MAIL_OVERRIDE_TO:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      # Volúmenes anónimos: el node_modules del contenedor (Linux) no se pisa
      # con el del host (macOS) — los binarios nativos son de arquitecturas distintas.
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      TZ: Europe/Madrid
      # TUNNEL=true cuando la web se expone por ngrok (ajusta el HMR a wss:443)
      TUNNEL: ${TUNNEL:-}
      # Lista separada por comas para sobrescribir los hosts permitidos por Vite
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      - '${WEB_PORT:-5173}:5173'
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules

volumes:
  veline-db:

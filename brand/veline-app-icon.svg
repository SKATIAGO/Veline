<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Veline">
  <!-- Ícono de app (3a) — fondo marrón oscuro, hojas canela + crema.
       Radio 68 (~13%), igual que el mockup; en iOS el sistema aplica su propio squircle.
       La marca ocupa ~37% del ancho, misma proporción que en el mockup (52px sobre tile de 150px). -->
  <rect width="512" height="512" rx="68" fill="#2E2119"/>
  <g transform="translate(160 166) scale(3.2)">
    <rect x="6" y="6" width="18" height="44" rx="4" fill="#A96A3E" transform="rotate(-9 15 28)"/>
    <rect x="36" y="6" width="18" height="44" rx="4" fill="#F2E7D6" transform="rotate(9 45 28)"/>
  </g>
</svg>

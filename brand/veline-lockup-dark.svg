<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 34" width="160" height="34" role="img" aria-label="Veline">
  <!-- Lockup horizontal (3b) — sobre fondo marrón oscuro (#2E2119).
       El texto es vivo: requiere Bricolage Grotesque 600 cargada. -->
  <g transform="translate(0 1) scale(0.5714)">
    <rect x="6" y="6" width="18" height="44" rx="4" fill="#D9A441" transform="rotate(-9 15 28)"/>
    <rect x="36" y="6" width="18" height="44" rx="4" fill="#F2E7D6" transform="rotate(9 45 28)"/>
  </g>
  <text x="48" y="17" dominant-baseline="central"
        font-family="'Bricolage Grotesque', sans-serif" font-weight="600" font-size="30"
        fill="#F2E7D6">Veline</text>
</svg>

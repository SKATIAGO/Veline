# Sirve el build estático de la SPA. El enrutado de /api/* lo hace Caddy por
# delante, directo al contenedor de la API — este nginx nunca ve esas
# peticiones.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los archivos con hash en el nombre (los que genera Vite) no cambian
    # nunca de contenido: cachearlos "para siempre" es seguro.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html y la
    # resuelve React Router en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
